name: Data Integrity

# Read-only assertions about the data and the pipeline. This workflow never
# writes to the repository and has no write permissions, which is why it is safe
# to arm on push and pull_request while the other data workflows are de-armed.
#
# What it asserts, and why each one is here:
#
#   check_workflow_disarm.py   the workflows that can commit stay unable to run
#                              unattended. A comment saying so is one careless
#                              edit from gone; this fails a build instead.
#
#   check_invariants.py        the claims this repo documents about itself are
#                              true right now -- manifest checksums, feed counts,
#                              zone boundaries. Every documented claim that got
#                              measured during the 2026-07 forward-fill turned
#                              out to be slightly wrong, so they are asserted
#                              rather than written down.
#
#   project_candidates --check data/serveable/ is a build output, byte-identical
#                              to a fresh projection. The repo previously lost
#                              this property for seven months: MANIFEST.json said
#                              28 events while all_events.json said 1,194,
#                              because two producers wrote to one zone and
#                              nothing compared them.
#
#   check_evidence.py          evidence actually supports the date attached to
#                              it. Shipped 2026-08-06 with "offline, gates CI" in
#                              its own docstring and was not wired in until
#                              2026-08-06 evening -- a check nothing runs is a
#                              check that will be true until the day it is not.
#                              Offline layer only; --online fetches URLs and must
#                              never gate, because a remote server being down is
#                              not a defect in this repository.
#
#   check_references.py        the references in this repo's prose resolve to
#                              something. Written after a cross-repo memo cited a
#                              commit that existed on no ref, and three readers
#                              passed over the line without dereferencing it.
#                              Gates on dangling paths in live documents; warns
#                              on historical ones, on unqualified issue numbers,
#                              and on anything listed in config/reference_drift.json
#                              with a reason.
#
#   check_transcoding.py       no derived zone carries a UTF-8-read-as-CP1252
#                              corruption. Two served event titles were mojibake
#                              from 2025-12-24 until 2026-08-06 and every gate
#                              here passed on them, because the species injects
#                              PLAUSIBLE PRINTABLE characters -- the ASCII gate
#                              saw \uXXXX escapes, the control scan saw
#                              codepoints above 32, the count invariants saw the
#                              right number of records. data/raw/ is reported and
#                              not gated: it is immutable, so the repair belongs
#                              in the producer, not in the dump.
#
#   redact_emails.py --ci      no TRACKED file carries an address-shaped
#                              fragment. Ten records sat in the public zone for
#                              eight months after a redaction pass reported
#                              clean, because the pattern that failed to match
#                              them was also the pattern asked whether anything
#                              had been missed. This gates on residue_scan, the
#                              independently written one, and on tracked files
#                              only: the 196MB local dump is gitignored, was
#                              never published, and must not fail a build for
#                              everyone else.
#
#   scan_postal.py --ci        no TRACKED file carries DWELLING-shaped postal,
#                              geographic or telephone text. Separate from
#                              redact_emails.py because that tool matches an
#                              at-sign or its wreckage, so no setting of it
#                              could ever see a street. It reports paths and
#                              line numbers and never the matched text, because
#                              these logs are public. The discriminator against
#                              the ten institutional addresses already in the
#                              corpus is an INSTITUTION token in the surrounding
#                              window, not a narrower street list: an alarm that
#                              fired on every university affiliation block would
#                              be muted within a week.
#
#   tests/test_*.py            run directly. pytest is in requirements.txt but
#                              these are standalone runners and both pass without
#                              it; invoking python directly keeps this job free of
#                              any pip install, so it cannot break on dependency
#                              drift.
#
# Only PyYAML is installed, for the de-arm guard. Everything else is stdlib.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Assert data and pipeline invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Write-capable workflows are de-armed
        run: python scripts/validation/check_workflow_disarm.py

      - name: Repository invariants hold
        run: python scripts/validation/check_invariants.py

      - name: Evidence supports the dates attached to it
        run: python scripts/validation/check_evidence.py

      - name: References in prose resolve to something
        run: python scripts/validation/check_references.py

      - name: No transcoding corruption in any derived zone
        run: python scripts/validation/check_transcoding.py

      - name: No email addresses in any tracked zone
        run: python scripts/privacy/redact_emails.py --ci

      - name: The privacy gate can still fail
        run: python tests/test_privacy_gate.py

      - name: No dwelling addresses in any tracked zone
        run: python scripts/privacy/scan_postal.py --ci

      - name: The postal gate can still fail
        run: python tests/test_postal_gate.py

      - name: The transcoding detector still fires
        run: python tests/test_transcoding_detector.py

      - name: Serveable zone matches a fresh build (candidates)
        run: python scripts/build/project_candidates.py --check

      - name: Serveable zone matches a fresh build (frontier labs)
        run: python scripts/build/project_frontier_labs.py --check

      - name: Serveable zone matches a fresh build (promoted reviews)
        run: python scripts/build/project_reviewed.py --check

      - name: Serveable zone matches a fresh build (timeline events)
        run: python scripts/build/project_timeline_events.py --check

      - name: Serveable zone matches a fresh build (taxonomy)
        run: python scripts/build/project_taxonomy.py --check

      - name: Taxonomy gate can still fail
        run: python tests/test_taxonomy_gate.py

      - name: Dump-space tests
        run: python tests/test_dump_spaces.py

      - name: Migration tests
        run: python tests/test_migration.py
